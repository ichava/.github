# actionlint 1.7.12 bundles metadata for actions/create-github-app-token from before v3, where
# `client-id` replaced the now-deprecated `app-id`. Ignore exactly those two stale findings; drop
# this file once an actionlint release knows v3.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
